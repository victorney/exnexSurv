url: https://victorney.github.io/exnexSurv/

template:
  bootstrap: 5
  bootswatch: flatly
  light-switch: true

home:
  title: "exnexSurv"
  description: >-
    Bayesian pooling models (EXNEX, complete pooling, no pooling) for
    right-censored log-normal data in basket trials, fitted with a fast
    data-augmented Gibbs sampler (Rcpp/RcppArmadillo).
    `pooling_surv()` with `pooling = "exnex"`, `"complete"`, or `"none"`.

navbar:
  structure:
    left: [home, intro, reference, articles]
    right: [github, lightswitch]
  components:
    home: ~
    github:
      icon: fab fa-github fa-lg
      href: https://github.com/victorney/exnexSurv

reference:
  - title: "Fitting"
    desc: "Fit a Bayesian pooling survival model: EXNEX (`pooling = \"exnex\"`), complete pooling (`\"complete\"`), or no pooling (`\"none\"`)."
    contents:
      - pooling_surv
      - exnex_surv
  - title: "Inference and model selection"
    desc: "Posterior summaries, survival curves, model comparison and simulation."
    contents:
      - survival_curves
      - plot.survival_exnex
      - median_survival
      - rmst
      - compute_waic
      - compare_waic
      - probability_superiority
      - rank_probabilities
      - convergence_diagnostics
      - simulate_data
  - title: "Model checking and visuals"
    desc: "Posterior predictive checks and shrinkage diagnostics for fitted `pooling_surv` objects."
    contents:
      - posterior_predictive_check
      - shrinkage_plot
  - title: "Methods for fitted objects"
    desc: "Summarise, print, and plot fitted `pooling_surv` objects."
    contents:
      - summary.pooling_surv
      - print.pooling_surv
      - plot.pooling_surv
  - title: "Internal functions"
    desc: "These functions are internal and not exported; use with caution."
    contents:
      - cpp_exnex_gibbs
      - pooling_surv_bridge
      - new_pooling_surv
      - .extract_event_vector
      - .extract_time_vector
      - .make_chain_seeds
      - .run_chains_parallel_pooling
      - .run_single_chain_pooling

articles:
  - title: "Start here"
    navbar: "Start here"
    desc: "Get up and running."
    contents:
      - getting-started
  - title: "Methodology"
    navbar: "Methodology"
    desc: "The statistical model, priors, data augmentation, and the sampler."
    contents:
      - model-and-methods
  - title: "Practical guides"
    navbar: "Practical guides"
    desc: "MCMC stability checks, running chains in parallel, and inference tools."
    contents:
      - convergence-and-diagnostics
      - parallel-chains
      - tools-for-experimenters
